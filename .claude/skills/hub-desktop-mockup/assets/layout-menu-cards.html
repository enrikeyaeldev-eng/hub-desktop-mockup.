<div class="window">
  <!-- SHELL: tab strip -->
  <div class="tabstrip">
    <div class="tab home is-active"><svg class="i"><use href="#i-home"/></svg>CORE USA</div><div class="tab"><svg class="i"><use href="#i-search"/></svg><span class="t">Event Reports</span></div>
    <div class="titlebar"><svg class="i rec"><use href="#i-rec"/></svg><svg class="i user"><use href="#i-user"/></svg><span class="winctl">–</span><span class="winctl">▢</span><span class="winctl">✕</span></div>
  </div>

  <!-- PAGE -->
  <main class="page">
    <div class="page-header has-quick-search">
      <div class="quick-search"><span class="value">kitche</span><svg class="i"><use href="#i-x"/></svg><svg class="i"><use href="#i-filter"/></svg></div>
      <span class="hint">Ctrl+T</span>
    </div>
    <div class="page-body">
      <svg class="i scroll-hint up"><use href="#i-chev-up"/></svg><svg class="i scroll-hint down"><use href="#i-chev-down"/></svg>
      <div class="card-wrap">
        <section class="menu-card"><div class="menu-card-header">Kitchen</div><div class="menu-card-body"><div class="menu-item is-selected"><svg class="i"><use href="#i-report"/></svg><span class="t">Kitchen Menu</span></div></div></section>
        <section class="menu-card"><div class="menu-card-header">Kitchen References</div><div class="menu-card-body"><div class="menu-item"><svg class="i"><use href="#i-grid"/></svg><span class="t">Kitchen Teams</span></div><div class="menu-item"><svg class="i is-blank"><use href="#i-grid"/></svg><span class="t">Kitchen Setup</span></div><div class="menu-item"><svg class="i is-blank"><use href="#i-grid"/></svg><span class="t">Kitchens</span></div></div></section>
        <section class="menu-card"><div class="menu-card-header">Sample Forms</div><div class="menu-card-body"><div class="menu-item"><svg class="i"><use href="#i-bolt"/></svg><span class="t">Kitchen Sink Multi-Step</span></div><div class="menu-item"><svg class="i"><use href="#i-grid"/></svg><span class="t">Kitchen Sinks</span></div></div></section>
        <section class="menu-card"><div class="menu-card-header">Event Management</div><div class="menu-card-body"><div class="menu-item"><svg class="i"><use href="#i-bolt"/></svg><span class="t">Volunteer Program Congregation Assignment</span></div><div class="menu-item"><svg class="i is-blank"><use href="#i-grid"/></svg><span class="t">Volunteer Program Selection</span></div></div></section>
      </div>
    </div>
  </main>

  <!-- SHELL: action bar -->
  <footer class="action-bar">
    <button class="btn outline"><svg class="i"><use href="#i-arrow-right"/></svg><span>Open</span></button><span class="spacer"></span><button class="btn primary"><svg class="i"><use href="#i-pencil"/></svg><span>Edit</span></button>
  </footer>

  <!-- SHELL: right rail (do not change) -->
  <nav class="rail">
    <div class="rail-item"><svg class="i"><use href="#i-tasks"/></svg><span class="rail-count">1646</span></div>
    <div class="rail-item"><svg class="i"><use href="#i-wrench"/></svg></div>
    <div class="rail-item"><svg class="i"><use href="#i-alert"/></svg></div>
    <div class="rail-item"><svg class="i"><use href="#i-flag"/></svg><span class="rail-badge">9+</span></div>
    <div class="rail-item"><svg class="i"><use href="#i-help"/></svg></div>
    <div class="rail-item"><span class="rail-ai">AI<small>BETA ✦</small></span></div>
    <div class="rail-item"><svg class="i"><use href="#i-inspect"/></svg></div>
    <div class="rail-logo"><svg class="i"><use href="#i-logo"/></svg></div>
  </nav>
</div>
</body>
