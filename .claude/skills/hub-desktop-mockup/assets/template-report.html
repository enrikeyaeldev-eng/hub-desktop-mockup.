<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hub – Report</title>
<link rel="stylesheet" href="hub.css">
</head>
<body>
<!-- ICON SPRITE: copy as-is into every mockup. Use with <svg class="i"><use href="#i-name"/></svg> -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11 12 3l9 8"/><path d="M5 9.5V21h14V9.5"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10" cy="10" r="6"/><path d="m15 15 6 6"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M5 5l14 14M19 5 5 19"/></symbol>
  <symbol id="i-filter" viewBox="0 0 24 24"><path d="M3 4h18l-7 9v7l-4-2v-5z"/></symbol>
  <symbol id="i-rec" viewBox="0 0 24 24"><rect x="3" y="5" width="12" height="14" fill="currentColor" stroke="none"/><path d="M18 7v10M21 9v6"/></symbol>
  <symbol id="i-user" viewBox="0 0 32 32"><circle cx="16" cy="16" r="14.5"/><circle cx="16" cy="12.5" r="5"/><path d="M6.5 26.5c2-4.5 5.5-6.5 9.5-6.5s7.5 2 9.5 6.5"/></symbol>
  <symbol id="i-tasks" viewBox="0 0 24 24"><rect x="3" y="3" width="5" height="5"/><path d="M11 5.5h10"/><rect x="3" y="10" width="5" height="5"/><path d="M11 12.5h10"/><path d="M3 19.5h5M11 19.5h10"/></symbol>
  <symbol id="i-wrench" viewBox="0 0 24 24"><path d="M14.5 6.5a4.5 4.5 0 0 0 5.8 5.2L9 23l-3-3L17.3 8.7"/><path d="M14.5 6.5 17 4a4.5 4.5 0 0 1 3.5 1.5L18 8"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 3 2 21h20z"/><path d="M12 10v5M12 18v.5"/></symbol>
  <symbol id="i-flag" viewBox="0 0 24 24"><path d="M4 22V4h12l-2 4 2 4H7v5"/><path d="M4 17h3"/></symbol>
  <symbol id="i-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 1-1 1.7v1M12 17v.5"/></symbol>
  <symbol id="i-inspect" viewBox="0 0 24 24"><path d="M13 19H3V5h18v6"/><circle cx="17" cy="16" r="3"/><path d="m19.2 18.2 2.3 2.3"/></symbol>
  <symbol id="i-logo" viewBox="0 0 52 44"><path d="M7 4H3v36h4M45 4h4v36h-4"/><path d="M11 22h4M15 16v12M19 19v6M23 12v20M27 18v8M31 20v4M35 8v28M39 22h2"/></symbol>
  <symbol id="i-share" viewBox="0 0 24 24"><path d="M14 4l7 7-7 7v-4c-5 0-8 1.5-11 5 1-6 4-10 11-10.5z" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-arrow-right" viewBox="0 0 24 24"><path d="M3 12h17M14 6l6 6-6 6"/></symbol>
  <symbol id="i-arrow-left" viewBox="0 0 24 24"><path d="M21 12H4M10 6l-6 6 6 6"/></symbol>
  <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M4 20l1-5L16 4l4 4L9 19z" fill="currentColor"/></symbol>
  <symbol id="i-save" viewBox="0 0 24 24"><path d="M4 4h13l3 3v13H4z"/><path d="M8 4v5h8V4M8 20v-6h8v6"/></symbol>
  <symbol id="i-preview" viewBox="0 0 24 24"><path d="M3 5h11M3 10h7M3 15h5M3 20h5"/><circle cx="15" cy="15" r="4"/><path d="m18 18 3 3"/></symbol>
  <symbol id="i-print" viewBox="0 0 24 24"><path d="M6 9V3h12v6"/><rect x="2" y="9" width="20" height="9" rx="1" fill="currentColor"/><rect x="6" y="14" width="12" height="7" fill="var(--primary)"/></symbol>
  <symbol id="i-grid" viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16"/><path d="M2 9h20M2 14.5h20M9 4v16"/></symbol>
  <symbol id="i-report" viewBox="0 0 24 24"><path d="M3 5h9M3 10h6M3 15h4"/><circle cx="14" cy="14" r="5"/><path d="m18 18 4 4"/></symbol>
  <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M14 2 7 14h5l-2 8 7-12h-5z" fill="currentColor"/></symbol>
  <symbol id="i-chev-up" viewBox="0 0 24 24"><path d="m5 15 7-7 7 7"/></symbol>
  <symbol id="i-chev-down" viewBox="0 0 24 24"><path d="m5 9 7 7 7-7"/></symbol>
  <symbol id="i-chev-right" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
  <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/><circle cx="12" cy="12" r="6.5"/></symbol>
  <symbol id="i-pin" viewBox="0 0 24 24"><path d="M14 3l7 7-2 1-3 3 1 4-2 2-4-4-5 5M9 15l-4-4 2-2 4 1 3-3 1-2"/></symbol>
  <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></symbol>
  <symbol id="i-dots" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><circle cx="19" cy="12" r="1.6" fill="currentColor"/></symbol>
  <symbol id="i-magnify" viewBox="0 0 24 24"><circle cx="14" cy="10" r="6"/><path d="M10 14l-7 7"/></symbol>
  <symbol id="i-list" viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></symbol>
  <symbol id="i-tiles" viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6"/><rect x="14" y="4" width="6" height="6"/><rect x="4" y="14" width="6" height="6"/><rect x="14" y="14" width="6" height="6"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 4v16M4 12h16"/></symbol>
  <symbol id="i-tick" viewBox="0 0 24 24"><path d="m5 12 5 5 9-10"/></symbol>
  <symbol id="i-export" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16"/><path d="M12 4v16M12 9h9M12 14h9"/><path d="m5 9 4 6M9 9l-4 6"/></symbol>
  <symbol id="i-earth" viewBox="0 0 24 24"><circle cx="12" cy="7" r="4"/><path d="M12 11v6"/><path d="M4 21l2-5h12l2 5z"/></symbol>
  <symbol id="i-drive" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="1"/><path d="M3 9h18M7 4v5"/></symbol>
</svg>

<div class="window">
  <!-- TAB STRIP -->
  <div class="tabstrip">
    <div class="tab home"><svg class="i"><use href="#i-home"/></svg>CORE USA</div>
    <div class="tab"><svg class="i"><use href="#i-search"/></svg>Event Reports</div>
    <div class="tab active">Kitchen Menu [Report]<span class="close">✕</span>
      <div class="tab-tooltip">Kitchen Menu [Report]</div>
    </div>
    <div class="titlebar-right">
      <svg class="i rec"><use href="#i-rec"/></svg>
      <svg class="i avatar"><use href="#i-user"/></svg>
      <span class="winctl">–</span><span class="winctl">▢</span><span class="winctl">✕</span>
    </div>
  </div>

  <!-- MAIN -->
  <div class="main">
    <div class="header-panel">
      <span class="form-title">Kitchen Menu</span>
      <svg class="i share fill"><use href="#i-share"/></svg>
    </div>

    <div class="content-panel">
      <div class="groups">
        <section class="group">
          <div class="group-header">Report Criteria</div>
          <div class="group-body">
            <div class="fields">
              <div class="field">
                <label class="required">Kitchen</label>
                <div class="select"><span></span><i class="caret"></i></div>
              </div>
              <div class="field">
                <label class="required">Date</label>
                <div class="range"><div class="input"></div><span class="dash"></span><div class="input"></div></div>
              </div>
              <div class="field">
                <label>Include recipe number</label>
                <span class="check"></span>
              </div>
              <div class="field">
                <label>Include recipe description</label>
                <span class="check"></span>
              </div>
            </div>
          </div>
        </section>

        <section class="group">
          <div class="group-header secondary">Output</div>
          <div class="group-body">
            <div class="field">
              <label>Font size</label>
              <div class="options">
                <span class="option"><span class="radio checked"></span>Normal</span>
                <span class="option"><span class="radio"></span>Large</span>
              </div>
            </div>
          </div>
        </section>
      </div>
    </div>
  </div>

  <!-- FOOTER ACTION BAR -->
  <div class="footer">
    <span class="spacer"></span>
    <button class="btn primary"><svg class="i"><use href="#i-preview"/></svg>Preview</button>
    <button class="btn primary"><svg class="i"><use href="#i-print"/></svg>Print</button>
  </div>

  <!-- RIGHT RAIL (do not change) -->
  <nav class="rail">
    <div class="rail-item"><svg class="i"><use href="#i-tasks"/></svg><span class="count">1646</span></div>
    <div class="rail-item"><svg class="i"><use href="#i-wrench"/></svg></div>
    <div class="rail-item"><svg class="i"><use href="#i-alert"/></svg></div>
    <div class="rail-item"><svg class="i"><use href="#i-flag"/></svg><span class="badge">9+</span></div>
    <div class="rail-item"><svg class="i"><use href="#i-help"/></svg></div>
    <div class="rail-item"><span class="ai">AI<small>BETA ✦</small></span></div>
    <div class="rail-item"><svg class="i"><use href="#i-inspect"/></svg></div>
    <div class="rail-logo"><svg class="i"><use href="#i-logo"/></svg></div>
  </nav>
</div>
</body>
</html>
